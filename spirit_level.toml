# spirit_level (spl) at the medium, ai and embedded tiers. The workspace has no firmware binary (size_bench/fw is a
# workspace of its own), so of the embedded tier the assertion lints and its Clippy set apply here.
extends = ["medium", "ai", "embedded"]

[lints.exact-units-quantity]
level = "allow"
reason = "exact_units depends on shrink_wrap for its wire types: its unit types cannot be used here without a cycle"
